name: Offline Choice model

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check verifier regressions and witness replay
        run: python -m unittest discover -s verification -p 'test_*.py'
      - name: Explore finite models and detect faulty controls
        run: python verification/choice_model.py --output verification-output/report.json
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choice-model-report
          path: verification-output/report.json
          if-no-files-found: error
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --example parity --features verification
      - run: python verification/rust_parity.py --binary target/debug/examples/parity --output verification-output/rust-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-parity-${{ matrix.toolchain }}
          path: verification-output/rust-parity.json
          if-no-files-found: error
